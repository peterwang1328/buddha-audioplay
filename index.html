<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>小菩提育苗園 · 音頻導覽</title>

<!--
  ============================================================
  展覽音頻導覽卡 — 純播放器(掃 QR Code 進入)
  ============================================================
  核心元件:
    - 播放 / 暫停按鈕(畫面最顯眼、最大的置中元件)
    - 呼吸感假波形動畫(播放時律動,暫停時靜止)
    - 可拖曳快進/倒帶的進度條
    - 目前時間 / 總長度

  ▍音檔路徑在 CONFIG.audioSrc,目前指向 ./audio/guide.mp3

  ▍關於「掃描後零操作自動出聲」:
    iOS Safari / Android Chrome 都禁止頁面載入即自動出聲,
    這是瀏覽器政策,無法真正繞過。本頁的折衷做法:
      1. 載入時仍嘗試呼叫 audio.play(),用 promise catch 包起來。
      2. 自動播放失敗(預期中的多數情況)時,大播放鍵維持置中、
         顯眼,使用者只需點一下即可播放。
      3. 播放鍵前不放任何需要閱讀的文字。

  ▍技術重點:
    1. 不用 <audio autoplay>,改用大按鈕讓使用者主動點擊播放。
    2. 用原生 <audio> 元素 + 自訂控制介面,相容性最好。
    3. 波形是「裝飾用」的呼吸動畫,並非真實波形分析。
    4. 進度條(input[type=range])同時身兼「顯示進度」與
       「拖曳快進/倒帶」兩種功能。
    5. 單一檔案,無建置流程,可直接部署到 GitHub Pages。
  ============================================================
-->

<style>
  :root {
    --wall:        #ECE9E2;
    --ink:         #201F1C;
    --ink-soft:    #55534C;
    --moss:        #55654D;
    --moss-deep:   #3E4A38;
    --card:        #F7F5F0;
    --line:        #D8D3C7;
    --shadow:      0 1px 2px rgba(32,31,28,0.04), 0 8px 24px rgba(32,31,28,0.06);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100dvh;
    background: var(--wall) url("./assets/background.jpg") center / cover no-repeat fixed;
    color: var(--ink);
    font-family: "Noto Sans TC", "Noto Sans", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(20px, 5vh, 36px);
    padding: 24px;
    /* 整組往上偏一點,讓下方插畫裡的孩子不被卡片壓到 */
    padding-bottom: calc(24px + min(12vh, 88px));
  }

  /* 標題字(去背 PNG):寬度略窄於播放卡,視覺上形成上下呼應 */
  .site-title {
    width: 100%;
    max-width: 372px;
    height: auto;
    display: block;
    /* 背景是水彩插畫,加一層極淡的白暈讓墨色字在葉片上仍清晰 */
    filter: drop-shadow(0 1px 3px rgba(255, 255, 255, 0.75));
  }

  .player-card {
    width: 100%;
    max-width: 400px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 4px;
    box-shadow: var(--shadow);
    padding: 24px;
  }

  .player {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .play-btn {
    flex: none;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: var(--moss);
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
    -webkit-tap-highlight-color: transparent;
  }

  .play-btn:active { transform: scale(0.95); }
  .play-btn:hover { background: var(--moss-deep); }
  .play-btn svg { width: 20px; height: 20px; }

  .player-info {
    flex: 1;
    min-width: 0;
  }

  .waveform {
    display: flex;
    align-items: center;
    gap: 3px;
    height: 24px;
    margin-bottom: 6px;
  }

  .waveform span {
    display: block;
    width: 3px;
    border-radius: 2px;
    background: var(--line);
    height: 6px;
    transition: height 0.15s ease, background 0.15s ease;
  }

  .player.is-playing .waveform span {
    background: var(--moss);
    animation: wave 1.1s ease-in-out infinite;
  }

  .player.is-playing .waveform span:nth-child(1)  { animation-delay: 0.0s; }
  .player.is-playing .waveform span:nth-child(2)  { animation-delay: 0.1s; }
  .player.is-playing .waveform span:nth-child(3)  { animation-delay: 0.2s; }
  .player.is-playing .waveform span:nth-child(4)  { animation-delay: 0.3s; }
  .player.is-playing .waveform span:nth-child(5)  { animation-delay: 0.15s; }
  .player.is-playing .waveform span:nth-child(6)  { animation-delay: 0.25s; }
  .player.is-playing .waveform span:nth-child(7)  { animation-delay: 0.05s; }
  .player.is-playing .waveform span:nth-child(8)  { animation-delay: 0.35s; }
  .player.is-playing .waveform span:nth-child(9)  { animation-delay: 0.2s; }
  .player.is-playing .waveform span:nth-child(10) { animation-delay: 0.1s; }

  @keyframes wave {
    0%, 100% { height: 6px; }
    50% { height: 22px; }
  }

  .time-row {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
  }

  .progress-track {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 3px;
    border-radius: 2px;
    background: var(--line);
    margin: 8px 0 4px;
    cursor: pointer;
  }

  .progress-track::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--moss);
    margin-top: -4.5px;
  }

  .progress-track::-moz-range-thumb {
    width: 12px;
    height: 12px;
    border: none;
    border-radius: 50%;
    background: var(--moss);
  }

  .progress-track::-webkit-slider-runnable-track {
    height: 3px;
    border-radius: 2px;
    background: var(--line);
  }

  /* 極矮的畫面(橫置手機)縮小標題並收掉上偏移,避免被裁切 */
  @media (max-height: 480px) {
    body { padding-bottom: 24px; gap: 16px; }
    .site-title { max-width: 260px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .player.is-playing .waveform span { animation: none; height: 14px; }
    .play-btn { transition: none; }
  }
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600&display=swap" rel="stylesheet">

</head>
<body>

<img class="site-title" src="./assets/title.png"
     alt="普彰精舍 小菩提育苗園" width="880" height="331" fetchpriority="high">

<div class="player-card">
  <div class="player" id="player">
    <button class="play-btn" id="playBtn" aria-label="播放語音導覽">
      <svg id="playIcon" viewBox="0 0 24 24" fill="none">
        <path d="M8 5v14l11-7-11-7z" fill="#F7F5F0"/>
      </svg>
      <svg id="pauseIcon" viewBox="0 0 24 24" fill="none" style="display:none;">
        <rect x="6" y="5" width="4" height="14" rx="1" fill="#F7F5F0"/>
        <rect x="14" y="5" width="4" height="14" rx="1" fill="#F7F5F0"/>
      </svg>
    </button>

    <div class="player-info">
      <div class="waveform">
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span>
      </div>
      <input type="range" class="progress-track" id="progress" value="0" min="0" max="100" step="0.1">
      <div class="time-row">
        <span id="currentTime">0:00</span>
        <span id="duration">--:--</span>
      </div>
    </div>
  </div>
</div>

<!-- 實際播放用的音訊元素,不顯示原生控制列 -->
<audio id="audio" preload="metadata" playsinline></audio>

<script>
  /* ============================================================
     CONFIG — 音檔路徑
     ============================================================ */
  const CONFIG = {
    audioSrc: "./audio/guide.mp3"
  };

  const audio = document.getElementById('audio');
  const playBtn = document.getElementById('playBtn');
  const playIcon = document.getElementById('playIcon');
  const pauseIcon = document.getElementById('pauseIcon');
  const player = document.getElementById('player');
  const progress = document.getElementById('progress');
  const currentTimeEl = document.getElementById('currentTime');
  const durationEl = document.getElementById('duration');

  audio.src = CONFIG.audioSrc;

  function formatTime(sec) {
    if (!isFinite(sec)) return "--:--";
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60).toString().padStart(2, '0');
    return `${m}:${s}`;
  }

  audio.addEventListener('loadedmetadata', () => {
    durationEl.textContent = formatTime(audio.duration);
  });

  // 拖曳進度條時(使用者手動操作),暫停用 timeupdate 更新進度,避免互相打架
  let isScrubbing = false;

  audio.addEventListener('timeupdate', () => {
    currentTimeEl.textContent = formatTime(audio.currentTime);
    if (!isScrubbing && audio.duration) {
      progress.value = (audio.currentTime / audio.duration) * 100;
    }
  });

  audio.addEventListener('ended', () => {
    setPlayingState(false);
    progress.value = 0;
    currentTimeEl.textContent = formatTime(0);
  });

  // 播放狀態同步(不論是使用者點擊、還是自動播放嘗試觸發)
  audio.addEventListener('play', () => setPlayingState(true));
  audio.addEventListener('pause', () => setPlayingState(false));

  function setPlayingState(isPlaying) {
    player.classList.toggle('is-playing', isPlaying);
    playIcon.style.display = isPlaying ? 'none' : 'block';
    pauseIcon.style.display = isPlaying ? 'block' : 'none';
    playBtn.setAttribute('aria-label', isPlaying ? '暫停語音導覽' : '播放語音導覽');
  }

  playBtn.addEventListener('click', () => {
    if (audio.paused) {
      audio.play().catch(err => {
        console.error('播放失敗,請確認音檔路徑是否正確:', err);
      });
    } else {
      audio.pause();
    }
  });

  // 快進/倒帶:
  //   - 拖曳中(input):只更新時間文字,不動 audio.currentTime。
  //     若每次 input 都設一次 currentTime,會連續觸發數十次 seek 互相
  //     取消,放開後常常跳回 0:00 重播 —— 這正是要修掉的 bug。
  //   - 放開時(change):才真正 seek 一次,停在放開的位置。
  function seekTimeFromSlider() {
    return (progress.value / 100) * audio.duration;
  }

  progress.addEventListener('input', () => {
    isScrubbing = true;
    if (audio.duration) {
      currentTimeEl.textContent = formatTime(seekTimeFromSlider());
    }
  });

  progress.addEventListener('change', () => {
    if (audio.duration) {
      const seekTime = seekTimeFromSlider();
      audio.currentTime = seekTime;
      currentTimeEl.textContent = formatTime(seekTime);
    }
    isScrubbing = false;
  });

  /* ============================================================
     載入時嘗試自動播放
     ------------------------------------------------------------
     iOS Safari / Android Chrome 幾乎一定會擋下(需要使用者手勢),
     這裡用 promise catch 吞掉錯誤 —— 失敗是預期中的行為。
     失敗時畫面不變:大播放鍵維持置中、顯眼,使用者點一下即播放。
     成功時(少數桌機或已放寬政策的情況)'play' 事件會自動把 UI
     切成播放中狀態。
     ============================================================ */
  function attemptAutoplay() {
    try {
      const p = audio.play();
      if (p && typeof p.then === 'function') {
        p.catch(() => { /* 自動播放被瀏覽器擋下,維持 fallback UI */ });
      }
    } catch (e) {
      /* 同步例外也一併吞掉,維持 fallback UI */
    }
  }

  if (document.readyState === 'complete') {
    attemptAutoplay();
  } else {
    window.addEventListener('load', attemptAutoplay);
  }
</script>

</body>
</html>
