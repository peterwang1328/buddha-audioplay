<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>音頻導覽</title>

<!--
  ============================================================
  展覽音頻導覽卡 — 純播放器範本
  ============================================================
  只保留播放語音導覽所需的核心元件:
    - 播放 / 暫停按鈕
    - 呼吸感假波形動畫(播放時律動,暫停時靜止)
    - 可拖曳快進/倒帶的進度條
    - 目前時間 / 總長度

  ▍要客製化的地方,只有下面的 CONFIG.audioSrc,
    換成實際音檔網址即可。

  ▍多幅作品的做法(交給 Claude Code 時可以這樣說):
    把 CONFIG 抽成一個 works.json 或用網址參數 ?id=work01 帶入,
    搭配一份「作品清單 → 音檔檔名」對照表,批次產生每幅作品各自的
    HTML 頁面,再批次產生對應的 QR Code。

  ▍技術重點:
    1. 不用 <audio autoplay>,因為 iOS/Android 都會擋自動播放,
       改用大按鈕讓使用者主動點擊播放。
    2. 用原生 <audio> 元素 + 自訂控制介面,相容性最好。
    3. 波形是「裝飾用」的呼吸動畫,並非真實波形分析,
       避免引入額外的音訊處理函式庫,降低相容性風險。
    4. 進度條(input[type=range])同時身兼「顯示進度」與
       「拖曳快進/倒帶」兩種功能:拖曳時透過 input 事件
       即時設定 audio.currentTime。
    5. 單一檔案,無建置流程,可直接部署到 GitHub Pages /
       Cloudflare Pages。
  ============================================================
-->

<style>
  :root {
    --wall:        #ECE9E2;
    --ink:         #201F1C;
    --ink-soft:    #55534C;
    --moss:        #55654D;
    --moss-deep:   #3E4A38;
    --card:        #F7F5F0;
    --line:        #D8D3C7;
    --shadow:      0 1px 2px rgba(32,31,28,0.04), 0 8px 24px rgba(32,31,28,0.06);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100dvh;
    background: var(--wall);
    color: var(--ink);
    font-family: "Noto Sans TC", "Noto Sans", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .player-card {
    width: 100%;
    max-width: 400px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 4px;
    box-shadow: var(--shadow);
    padding: 24px;
  }

  .player {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .play-btn {
    flex: none;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: var(--moss);
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
    -webkit-tap-highlight-color: transparent;
  }

  .play-btn:active { transform: scale(0.95); }
  .play-btn:hover { background: var(--moss-deep); }
  .play-btn svg { width: 20px; height: 20px; }

  .player-info {
    flex: 1;
    min-width: 0;
  }

  .waveform {
    display: flex;
    align-items: center;
    gap: 3px;
    height: 24px;
    margin-bottom: 6px;
  }

  .waveform span {
    display: block;
    width: 3px;
    border-radius: 2px;
    background: var(--line);
    height: 6px;
    transition: height 0.15s ease, background 0.15s ease;
  }

  .player.is-playing .waveform span {
    background: var(--moss);
    animation: wave 1.1s ease-in-out infinite;
  }

  .player.is-playing .waveform span:nth-child(1)  { animation-delay: 0.0s; }
  .player.is-playing .waveform span:nth-child(2)  { animation-delay: 0.1s; }
  .player.is-playing .waveform span:nth-child(3)  { animation-delay: 0.2s; }
  .player.is-playing .waveform span:nth-child(4)  { animation-delay: 0.3s; }
  .player.is-playing .waveform span:nth-child(5)  { animation-delay: 0.15s; }
  .player.is-playing .waveform span:nth-child(6)  { animation-delay: 0.25s; }
  .player.is-playing .waveform span:nth-child(7)  { animation-delay: 0.05s; }
  .player.is-playing .waveform span:nth-child(8)  { animation-delay: 0.35s; }
  .player.is-playing .waveform span:nth-child(9)  { animation-delay: 0.2s; }
  .player.is-playing .waveform span:nth-child(10) { animation-delay: 0.1s; }

  @keyframes wave {
    0%, 100% { height: 6px; }
    50% { height: 22px; }
  }

  .time-row {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
  }

  .progress-track {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 3px;
    border-radius: 2px;
    background: var(--line);
    margin: 8px 0 4px;
    cursor: pointer;
  }

  .progress-track::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--moss);
    margin-top: -4.5px;
  }

  .progress-track::-moz-range-thumb {
    width: 12px;
    height: 12px;
    border: none;
    border-radius: 50%;
    background: var(--moss);
  }

  .progress-track::-webkit-slider-runnable-track {
    height: 3px;
    border-radius: 2px;
    background: var(--line);
  }

  @media (prefers-reduced-motion: reduce) {
    .player.is-playing .waveform span { animation: none; height: 14px; }
    .play-btn { transition: none; }
  }
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600&display=swap" rel="stylesheet">

</head>
<body>

<div class="player-card">
  <div class="player" id="player">
    <button class="play-btn" id="playBtn" aria-label="播放語音導覽">
      <svg id="playIcon" viewBox="0 0 24 24" fill="none">
        <path d="M8 5v14l11-7-11-7z" fill="#F7F5F0"/>
      </svg>
      <svg id="pauseIcon" viewBox="0 0 24 24" fill="none" style="display:none;">
        <rect x="6" y="5" width="4" height="14" rx="1" fill="#F7F5F0"/>
        <rect x="14" y="5" width="4" height="14" rx="1" fill="#F7F5F0"/>
      </svg>
    </button>

    <div class="player-info">
      <div class="waveform">
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span>
      </div>
      <input type="range" class="progress-track" id="progress" value="0" min="0" max="100" step="0.1">
      <div class="time-row">
        <span id="currentTime">0:00</span>
        <span id="duration">--:--</span>
      </div>
    </div>
  </div>
</div>

<!-- 實際播放用的音訊元素,不顯示原生控制列 -->
<audio id="audio" preload="metadata"></audio>

<script>
  /* ============================================================
     CONFIG — 只需要換這一行
     ============================================================ */
  const CONFIG = {
    audioSrc: "./audio/work01.mp3" // 換成實際音檔網址
  };

  const audio = document.getElementById('audio');
  const playBtn = document.getElementById('playBtn');
  const playIcon = document.getElementById('playIcon');
  const pauseIcon = document.getElementById('pauseIcon');
  const player = document.getElementById('player');
  const progress = document.getElementById('progress');
  const currentTimeEl = document.getElementById('currentTime');
  const durationEl = document.getElementById('duration');

  audio.src = CONFIG.audioSrc;

  function formatTime(sec) {
    if (!isFinite(sec)) return "--:--";
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60).toString().padStart(2, '0');
    return `${m}:${s}`;
  }

  audio.addEventListener('loadedmetadata', () => {
    durationEl.textContent = formatTime(audio.duration);
  });

  // 拖曳進度條時(使用者手動操作),暫停用 timeupdate 更新進度,避免互相打架
  let isScrubbing = false;

  audio.addEventListener('timeupdate', () => {
    currentTimeEl.textContent = formatTime(audio.currentTime);
    if (!isScrubbing && audio.duration) {
      progress.value = (audio.currentTime / audio.duration) * 100;
    }
  });

  audio.addEventListener('ended', () => {
    setPlayingState(false);
    progress.value = 0;
    currentTimeEl.textContent = formatTime(0);
  });

  function setPlayingState(isPlaying) {
    player.classList.toggle('is-playing', isPlaying);
    playIcon.style.display = isPlaying ? 'none' : 'block';
    pauseIcon.style.display = isPlaying ? 'block' : 'none';
    playBtn.setAttribute('aria-label', isPlaying ? '暫停語音導覽' : '播放語音導覽');
  }

  playBtn.addEventListener('click', () => {
    if (audio.paused) {
      audio.play().catch(err => {
        console.error('播放失敗,請確認音檔網址是否正確:', err);
      });
      setPlayingState(true);
    } else {
      audio.pause();
      setPlayingState(false);
    }
  });

  // 快進/倒帶:拖曳中即時預覽時間顯示,放開才真正 seek 也可以,
  // 這裡採用「拖曳中就即時 seek」的做法,回饋更即時。
  progress.addEventListener('input', () => {
    isScrubbing = true;
    if (audio.duration) {
      const seekTime = (progress.value / 100) * audio.duration;
      audio.currentTime = seekTime;
      currentTimeEl.textContent = formatTime(seekTime);
    }
  });

  progress.addEventListener('change', () => {
    isScrubbing = false;
  });
</script>

</body>
</html>
